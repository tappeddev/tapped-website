baseURL = "https://tapped.dev/"
locale = "en"
theme = "raditian-free-hugo-theme-adjusted"
disableKinds = ["taxonomy", "term"]
disableDefaultLanguageRedirect = true
enableRobotsTXT = true

DefaultContentLanguage = "en"
defaultContentLanguageInSubdir = false


[languages]
  [languages.en]
    locale = "en"
    weight = 2
  [languages.de]
    locale = "de"
    weight = 1

# Plugins
[params.plugins]

  # CSS Plugins
  [[params.plugins.css]]
  URL = "css/main.purged.css"
  [[params.plugins.css]]
  URL = "css/rad-icons.css"
  [[params.plugins.css]]
  URL = "css/custom.css"

# navigation
[menu]

  [[menu.header]]
  name = "menuAbout"
  pageRef = "/about"
  weight = 2

  [[menu.header]]
  name = "menuService"
  pageRef = "/services"
  weight = 3

  [[menu.header]]
  name = "menuWorks"
  pageRef = "/work"
  weight = 5

  [[menu.header]]
  name = "menuContact"
  pageRef = "/contact"
  weight = 8

  [[menu.header]]
  name = "menuJobs"
  pageRef = "/jobs"
  weight = 9

  [[menu.footer]]
  name = "menuAbout"
  pageRef = "/about"
  weight = 1

  [[menu.footer]]
  name = "menuService"
  pageRef = "/services"
  weight = 2

  [[menu.footer]]
  name = "menuWorks"
  pageRef = "/work"
  weight = 3

  [[menu.footer]]
  name = "menuContact"
  pageRef = "/contact"
  weight = 4

  [[menu.footer]]
  name = "menuJobs"
  pageRef = "/jobs"
