[params]

  googleTagManagerID = "GTM-000000" # Google Analytics works with Google Tag Manager

  [params.logo]
    text1 = "Andreas"
    text2 = "Ellure"

  [params.footer]
      copyright = "© Tapped GmbH. All rights reserved."

  [params.jobs]
    # true  = open-role listing + homepage hiring banner
    # false = "no open roles" page (design next)
    hiring = false
