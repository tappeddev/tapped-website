name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.164.0
      TZ: Europe/Berlin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Hugo
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSL "${url}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          curl -fsSL "${url}/hugo_${HUGO_VERSION}_checksums.txt" |
            grep "  ${archive}$" |
            (cd "${RUNNER_TEMP}" && sha256sum --check --strict -)
          sudo dpkg -i "${RUNNER_TEMP}/${archive}"
          hugo version

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify
