{{ if .Site.Data.homepage.clients.enable }}
<section id="clients" class="section section--border-bottom">
  <div class="container">
    <h2 class=" rad-animation-group rad-fade-down">
      {{ i18n "clientsTitle" }}
    </h2>
    <div class="row row--padded rad-animation-group rad-fade-down">
      <div class="col-12">
        <div class="clients">
          {{ range .Site.Data.homepage.clients.clients }}
          <div class="clients__item">
            <a href="{{ .link }}" target="_blank" rel="noopener" aria-label="{{ .alt }}">
              <span class="sr-only">{{ .alt }}</span>
              <img
                class="img-responsive"
                src="{{ .logo.x | absURL }}"
                srcset="{{ .logo.x | absURL }} 1x, {{ .logo._2x | absURL }} 2x"
                width="{{ .width }}"
                height="{{ .height }}"
                loading="lazy"
                decoding="async"
                alt="{{ .alt }}"
              />
            </a>
          </div>
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
