# People currently at Tapped. Photos come from the Typst company documents.
# Optional per-member fields (shown in the landing-page constellation dialog):
#   bio: i18n key with a short description (add it to i18n/en.toml and de.toml)
#   linkedin: full profile URL
#
# Horizontal gallery of team events on the about page.
# Files are numbered by how many people are in the frame.
# shape: portrait | landscape | wide
