# works

[worksTitle]
other = "Projekte"

[customersStorywaysTitle]
other = "Storyways"

[customersStorywaysDescription]
other = '''
Spielbücher, in denen du zu einer bestimmten Seite springst, neu als App: interaktiver, unterhaltsamer und deutlich cooler.
<br>
Wir haben das gesamte System entwickelt: Backend, Frontend und eine SugarCube Runtime aus ANTLR und einer Grammatik, damit Autor:innen vollständig flexible interaktive Geschichten gestalten konnten.
<br>
<br>
Das Projekt ist inzwischen eingestellt. Mehr auf <a href="https://www.storyways.app" target="_blank">www.storyways.app</a>
'''

[customersVVSMobileTitle]
other = "VVS Mobil"

[customersVVSMobileDescription]
other = '''
Die VVS Mobil App ist die zentrale Mobilitätsplattform für die Region Stuttgart. Sie vereint ÖPNV, Sharing-Angebote und individuelle Mobilitätsformen in einer einzigen, intuitiven Anwendung. Nutzer erhalten in Echtzeit die besten Verbindungen, können Tickets direkt buchen und ihre gesamte Reise nahtlos planen – von der Haustür bis zum Ziel.
<br>
<br>
Dieses Projekt wurde in Zusammenarbeit mit MENTZ umgesetzt und ersetzt die alte native iOS und Android App.
'''

[customersFcbInsideTitle]
other = "FcbInside"

[customersFcbInsideDescription]
other = '''
Fühle das Herz des Vereins!
FCBinside — tagesaktuelle News, Transfers, Analysen und Podcasts rund um den FC Bayern.
Kurze, prägnante Stories und Transfer-Updates liefern dir das Vereinsgeschehen direkt auf den Punkt — perfekt für Fans, die kein Detail verpassen wollen.
<br>
<br>
Mehr Informationen auf <a href="https://fcbinside.de/" target="_blank">www.fcbinside.de</a>.
'''

[customersAurumToolsTitle]
other = "AurumTools"

[customersAurumToolsDescription]
other = '''
Spüre die Kraft deiner Werkbank!
AurumTools — die kostenlose All-in-one-App für Goldschmiede, ein Nebenprojekt der Kaddick Goldschmiede in München. Legierungsrechner, Edelstein-Tools, Ringweiten, Live-Edelmetallkurse und B2B/B2C-Preise gehören an die Werkbank, nicht in eine Tabelle. iOS, Android und eine Web App.
<br>
<br>
Die Vorstellung gibt es auf <a href="https://www.youtube.com/watch?v=iefLNMQhrmM" target="_blank">YouTube</a>. Mehr auf <a href="https://www.kaddick.de/aurumtool/" target="_blank">kaddick.de/aurumtool</a>, im <a href="https://apps.apple.com/de/app/aurumtools/id6739778914" target="_blank">App Store</a> und bei <a href="https://play.google.com/store/apps/details?id=com.goldschmiede.kaddick.aurumtools&hl=de" target="_blank">Google Play</a>.
'''

[customersVVSTitle]
other = "VVS Radroutenplaner"

[customersVVSDescription]
other = '''
Ob für Pendler- oder Freizeitradfahrer: Mit dem Radroutenplaner lassen sich Routen mit dem eigenen Rad, dem RegioRad oder in Kombination mit Bussen und Bahnen finden.
Außerdem steht ein großes Angebot an fertigen Touren zur Verfügung. Alle Routen lassen sich teilen oder im gpx-Format exportieren.
<br>
<br>
Dieses Projekt wurde in Zusammenarbeit mit MENTZ umgesetzt und ersetzt die alte native iOS und Android App.
'''

[customersDieRingeTitle]
other = "Die Ringe Bodyworkout"

[customersDieRingeDescription]
other = '''
Dein effektives Krafttraining an den Turnringen.
<br>
Die Ringe Bodyworkout ist deine App für effektives Training mit Turnringen.
Mit der Die Ringe Bodyworkout App kannst du systematisch und effektiv Kraft aufbauen, Skills lernen, beweglicher werden und nachhaltig gesunde Gewohnheiten etablieren.
Dabei bestimmst du, wann und wo du trainieren willst. Gehe in den Park, hänge die Ringe auf und starte dein Training!
<br>
<br>
Mehr Informationen auf <a href="https://www.dieringe.com/" target="_blank">www.dieringe.com</a>
'''

[worksAppellaTitle]
other = "Appella - Die Musikschul-App"

[worksAppellaDescription]
other = '''
Die erste Appella-Flutter-App: Dashboard, Stundenplan und Anwesenheit für Musikschulen auf iOS und Android.
