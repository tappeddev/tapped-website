[teamBioStefan]
other = "Stefan ist Geschäftsführer und Flutter/Mobile-Entwickler mit mehr als 6 Jahren Erfahrung in der Entwicklung von mobilen Applikationen und Websites mit Flutter. Zuständig für die Projektleitung und die technische Koordination der Projekte."

[teamBioJulian]
other = "Zuständig für die Projektleitung und die technische Koordination der Projekte. In den 10 Jahren Arbeitserfahrung wurde eine Vielzahl an Projekten betreut, darunter auch die Planung von Projekten mit klaren Deadlines und Förderungs-Budgets. Das technische Wissen ist hierbei essentiell, um effektive Entscheidungen treffen zu können und Kunden optimal zu beraten."

[teamBioTarek]
other = "Zuständig für Architektur und Entwicklung. Tarek ist ein Multitalent mit dem Fokus auf Flutter und mobile Applikationen sowie auf Backend-Integration mit Supabase und CMS-Lösungen wie Strapi und Directus. In seiner knapp 7-jährigen Karriere in der Entwicklung mobiler Applikationen baut Tarek sein Wissen weiter aus, arbeitet sich sehr schnell in neue Konzepte ein und überführt Anforderungen in eine solide Architektur."

[teamBioOtto]
other = "Zuständig für Entwicklung. Otto bringt Erfahrung in Flutter sowie in Backend-Systemen wie Strapi und Supabase mit und verbindet mobile App-Entwicklung mit solider Backend-Integration."

[teamBioSteffen]
other = "Zuständig für Architektur und Entwicklung. Steffen bringt mehrjährige Erfahrung in der Entwicklung von Web- und Mobilanwendungen mit und hat ein breites Spektrum an Projekten von der Konzeption bis zur Auslieferung begleitet. Mit seiner Begeisterung für Cloud-Technologien und moderne Backend-Systeme ist er eine große Bereicherung für das Team."

[teamBioJean]
other = "Zuständig für Entwicklung. Jean punktet nicht nur mit jahrelanger Flutter-Erfahrung, sondern taucht auch gern in neue komplexe Themengebiete ein und scheut sich vor keiner neuen Herausforderung. Beispielsweise Visualisierung, Aufbereitung und Analyse von Positionsdaten mit Python."

[teamBioStefanB]
other = "Zuständig für Strategie und Entwicklung. Stefan bringt tiefes Flutter-Know-how aus mehreren Produktlinien und Kundenprojekten mit und verbindet saubere App-Architektur mit einem starken Blick für UI/UX. Neben Dart/SQL und CI/CD hat er zuletzt vor allem Lösungen rund um mobile ERP-Anbindung, sichere Dokumentenprozesse und datengetriebene Auswertungen umgesetzt."

