[teamBioStefan]
other = "Stefan is managing director and Flutter/mobile developer with more than 6 years of experience building mobile applications and websites with Flutter. Responsible for project management and the technical coordination of projects."

[teamBioJulian]
other = "Responsible for project management and the technical coordination of projects. Over 10 years of work experience across a wide range of projects, including planning projects with clear deadlines and funding budgets. His technical knowledge is essential for making effective decisions and giving clients the best possible advice."

[teamBioTarek]
other = "Responsible for architecture and development. Tarek is a multi-talent focused on Flutter and mobile applications as well as backend integration with Supabase and CMS solutions such as Strapi and Directus. In almost 7 years of building mobile applications he keeps expanding his knowledge, picks up new concepts very quickly and turns requirements into a solid architecture."

[teamBioOtto]
other = "Responsible for development. Otto brings experience in Flutter as well as backend systems such as Strapi and Supabase, combining mobile app development with solid backend integration."

[teamBioSteffen]
other = "Responsible for architecture and development. Steffen brings several years of experience building web and mobile applications and has supported a broad range of projects from concept to delivery. With his enthusiasm for cloud technologies and modern backend systems, he is a great asset to the team."

[teamBioJean]
other = "Responsible for development. Jean not only brings years of Flutter experience, but also enjoys diving into new, complex topics and doesn't shy away from any challenge — for example visualizing, processing and analyzing position data with Python."

[teamBioStefanB]
other = "Responsible for strategy and development. Stefan brings deep Flutter know-how from several product lines and client projects, combining clean app architecture with a strong eye for UI/UX. Alongside Dart/SQL and CI/CD, he has recently focused on mobile ERP integration, secure document processes and data-driven reporting."

