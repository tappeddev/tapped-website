# works

[worksTitle]
other = "Projects"

[customersStorywaysTitle]
other = "Storyways"

[customersStorywaysDescription]
other = '''
Choose your path books, the ones where you skip to a page, rebuilt as an app: more interactive, more fun, and a lot cooler.
<br>
We built the full system: backend, frontend, and a SugarCube runtime from ANTLR and a grammar, so authors could design completely flexible interactive stories.
<br>
<br>
The project is now sunsetted. More on <a href="https://www.storyways.app" target="_blank">www.storyways.app</a>
'''

[customersVVSMobileTitle]
other = "VVS Mobil"

[customersVVSMobileDescription]
other = '''
The VVS Mobil app is the central mobility platform for the Stuttgart region. It combines public transport, sharing services, and individual mobility options in a single, intuitive application. Users receive real-time journey information, can purchase tickets directly, and plan their entire trip seamlessly — from door to destination.
<br>
<br>
This project was developed in collaboration with MENTZ and replaces the previous native iOS and Android apps.
'''

[customersFcbInsideTitle]
other = "FcbInside"

[customersFcbInsideDescription]
other = '''
Feel the club’s pulse!
FCBinside — daily news, transfers, analysis and podcasts about FC Bayern.
Short, punchy stories and transfer updates deliver the club’s happenings straight to the point — perfect for fans who don’t want to miss a single detail.
<br>
<br>
More information at <a href="https://fcbinside.de/" target="_blank">www.fcbinside.de</a>.
'''

[customersAurumToolsTitle]
other = "AurumTools"

[customersAurumToolsDescription]
other = '''
Feel the power of your workbench!
AurumTools — the free all-in-one app for goldsmiths from Kaddick in Munich. Alloy calculators, gemstone tools, ring-size converters, live metal rates and B2B/B2C pricing sit next to the bench instead of in a spreadsheet. iOS, Android and a web app.
<br>
<br>
Watch the intro on <a href="https://www.youtube.com/watch?v=iefLNMQhrmM" target="_blank">YouTube</a>. More at <a href="https://www.kaddick.de/aurumtool/" target="_blank">kaddick.de/aurumtool</a>, the <a href="https://apps.apple.com/app/aurumtools/id6739778914" target="_blank">App Store</a> and <a href="https://play.google.com/store/apps/details?id=com.goldschmiede.kaddick.aurumtools" target="_blank">Google Play</a>.
'''

[customersVVSTitle]
other = "VVS Cycle Planner"

[customersVVSDescription]
other = '''
Whether for commuters or leisure cyclists: with the cycle planner, routes can be found for your own bike, the RegioRad or in combination with buses and trains.
There is also a wide range of ready-made tours available. All routes can be shared or exported in gpx format.
<br>
<br>
This project was implemented in cooperation with MENTZ and replaces the old native iOS and Android apps.
'''

[customersDieRingeTitle]
other = "Die Ringe Bodyworkout"

[customersDieRingeDescription]
other = '''
Your effective strength training on the gymnastic rings.
<br>
The Rings Bodyworkout is your app for effective training with gymnastic rings.
With the Die Ringe Bodyworkout app you can systematically and effectively build strength, learn skills, become more agile and establish sustainable healthy habits.
You decide when and where you want to work out. Go to the park, hang up the rings and start your workout!
<br>
<br>
For more information visit <a href="https://www.dieringe.com/" target="_blank">www.dieringe.com</a>
'''

[worksAppellaTitle]
other = "Appella - The music school app"

[worksAppellaDescription]
other = '''
The first Appella Flutter app: dashboard, timetable and attendance for music schools on iOS and Android.
<br>
<br>
For more information visit <a href="https://www.appella.app" target="_blank">www.appella.app</a>
'''

