{{ partial "site-open.html" . }}
<main class="page-main page-main--legal">
  <div class="container">
    <header class="page-hero">
      <p class="page-kicker">{{ i18n "legalPageKicker" }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}
      <p class="lead">{{ . }}</p>
      {{ end }}
    </header>
    <div class="page-prose legal-prose">
      {{ partial "privacy.html" . }}
    </div>
  </div>
</main>
{{ partial "site-close.html" . }}
